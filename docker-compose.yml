services:
  devcon:
    image: ghcr.io/dermute/devcon:latest
    container_name: devcon
    environment:
      - PUID=${DEVCON_PUID:-1000}          # user id that owns files in the volume (check with `id -u`)
      - PGID=${DEVCON_PGID:-100}           # group id (100 = `users` on most NAS)
      - TZ=${TZ:-Europe/Berlin}
      - PASSWORD=${DEVCON_PASSWORD}        # code-server web password, set in .env
      - GIT_USER_NAME=${GIT_USER_NAME}     # git config --global user.name
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}   # git config --global user.email
      - DEVCON_USER=${DEVCON_USER:-abc}    # login username inside the container
      - DEVCON_CODE_SERVER=${DEVCON_CODE_SERVER:-true}  # code-server web UI (set false to disable)
      - DEVCON_SSH=${DEVCON_SSH:-true}     # ssh server (set false to disable)
      - DEVCON_SSH_PASSWORD_AUTH=${DEVCON_SSH_PASSWORD_AUTH:-false}  # ssh password login (default off = key-only)
      - DEVCON_SSH_PASSWORD=${DEVCON_SSH_PASSWORD:-}   # ssh password, used only when password auth is on
      - DEVCON_SSH_PUBKEY=${DEVCON_SSH_PUBKEY:-}       # public key to install for key-only ssh
      - DEVCON_DOCKER=${DEVCON_DOCKER:-true}   # rootless podman API socket + DOCKER_HOST (docker inside)
    ports:
      - "${DEVCON_WEB_PORT:-8443}:8443"   # code-server web UI -> http://<nas-ip>:<port>
      - "${DEVCON_SSH_PORT:-2222}:22"     # ssh                -> ssh -p <port> ${DEVCON_USER:-abc}@<nas-ip>
    volumes:
      # host path for persisted state (repos, ~/.claude, gh auth, ssh keys, podman images)
      - "${DEVCON_CONFIG:-/.config}:/config"
    # Podman-in-Docker needs the outer container to permit creation of nested user
    # and mount namespaces. Without this, newuidmap fails writing uid_map even
    # though Podman itself and all nested containers run as the non-root login user.
    # No host Docker/Podman socket is mounted.
    privileged: true
    # Keep the requirements explicit for runtimes that do not imply every
    # security option/device from privileged mode.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - label=disable
    devices:
      - /dev/fuse
    restart: unless-stopped
    # Deliberately no /var/run/docker.sock mount: nested Podman has its own store.
    #
    # to update:  docker compose pull && docker compose up -d
